[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/protocol",
    "crates/storage",
    "crates/transport",
    "crates/ai",
    "crates/services",
    "tools/node-cli",
    "app",
]

# ble-peripheral-rust 用仓库内 vendored 副本：原版 0.2.0 的 WinRT 事件回调里
# 大量 unwrap，回调 panic 穿越 FFI 会让进程 abort（真机实证对端被连入时闪退）。
# 补丁内容与原因见 third-party/ble-peripheral-rust/README.bluelink.md。
[patch.crates-io]
ble-peripheral-rust = { path = "third-party/ble-peripheral-rust" }

[workspace.package]
version = "2.5.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
