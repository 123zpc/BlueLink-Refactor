name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 桌面构建依赖（Tauri/WebKit）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: Clippy（警告即错误）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 单元与集成测试
        run: cargo test --workspace
