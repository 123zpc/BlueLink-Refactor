name: 发布安装包

# 打 v* 标签时触发：在三平台分别打包，并把安装包挂到对应的 GitHub Release（草稿）。
on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: 打包（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 桌面构建依赖（Tauri/WebKit）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
      - name: 打包并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BlueLink ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
