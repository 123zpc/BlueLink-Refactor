name: 发布安装包

# 打 v* 标签时触发：在三平台分别打包，并把安装包挂到对应的 GitHub Release（草稿）。
on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: 打包（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 桌面构建依赖（Tauri/WebKit）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
      # 仅 Windows：先校验 SimpleBLE 确实进入构建图（cargo tree 反查不到就红灯），
      # 再由下方 tauri-action 以 --features simpleble 打包。Linux/macOS 不启用
      # （不引入 CMake/D-Bus 原生依赖），其包内 SimpleBLE 入口会如实回落经典蓝牙。
      - name: 校验 Windows 构建包含 SimpleBLE
        if: runner.os == 'Windows'
        run: cargo tree -p bluelink-app --features simpleble -i simplersble
      # ②(a) 防再犯（v1.0.2）：latest.json 的 notes 由 tauri-action 在
      # 创建 Release 时按当时正文生成——v1.0.1 那次正文是事后在网页
      # 补的，静态文件里的 notes 一直是空串，应用内更新说明显示
      # 「未附更新说明」。此后每版：先把 docs/releases/vX.Y.Z.md
      # 的全文读出来，以 releaseBody 传入，让正文在生成 latest.json
      # 之前就已就位。注意 tauri-action v0 只有字符串入参
      # releaseBody（无 releaseBodyIsPath），必须先读文件再传值；
      # 文件缺失直接红灯，不许静默出空正文包。
      - name: 读取发布说明
        id: notes
        # Windows runner 上 run 默认是 PowerShell（date/$$/$RANDOM/heredoc
        # 全是 bash 写法会直接红灯——v1.0.2 首轮发布即因此折在 Windows），
        # 必须显式指定 bash（git bash 随 runner 自带，本仓 simpleble-check
        # 亦同此口径）。
        shell: bash
        run: |
          f="docs/releases/${{ github.ref_name }}.md"
          test -f "$f" || { echo "缺少发布说明 $f"; exit 1; }
          # 分隔符带时间戳+进程号+随机数：正文是人工写的 Markdown，固定
          # 分隔符若恰好出现在正文里会提前截断 heredoc（第三方评审）。
          d="BLUELINK_NOTES_$(date +%s)_$$_$RANDOM"
          {
            echo "body<<$d"
            cat "$f"
            echo "$d"
          } >> "$GITHUB_OUTPUT"
      - name: 打包并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新签名私钥（无密码，故只配这一个 Secret）：tauri.conf.json 已开
          # createUpdaterArtifacts，打包时据此产出各平台 .sig 与 latest.json；
          # 缺这个 Secret 时签名步会失败——这是有意的，不许静默出无签名包。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BlueLink ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ runner.os == 'Windows' && '--features simpleble' || '' }}
