name: simpleble-probe

# 试验专用 workflow（分支 spike/simpleble-ci）：
# 只验证 simplersble 能否在 GitHub 的 Windows runner（自带 MSVC + Windows SDK + CMake）
# 上为 x86_64-pc-windows-msvc 成功构建。不进产品、不发版。
# 构建完整输出写入仓库根 build-log.txt，并由最后步骤提交回本分支；
# build-log.txt 已列入 paths-ignore，日志提交不会再次触发本 workflow。
on:
  workflow_dispatch:
  push:
    branches:
      - spike/simpleble-ci
    paths-ignore:
      - 'build-log.txt'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable + windows-msvc target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build simpleble-probe for x86_64-pc-windows-msvc
        id: build
        shell: bash
        working-directory: probe/simpleble-probe
        run: |
          log="../../build-log.txt"
          {
            echo "=== simpleble-probe CI build log ==="
            echo "date(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "runner: ${RUNNER_OS} ${RUNNER_ARCH}"
            rustc --version || true
            cargo --version || true
            cmake --version | head -1 || true
            echo "=== cargo build --target x86_64-pc-windows-msvc ==="
          } > "$log"
          start=$(date +%s)
          cargo build --target x86_64-pc-windows-msvc 2>&1 | tee -a "$log"
          code=${PIPESTATUS[0]}
          end=$(date +%s)
          {
            echo "=== artifacts ==="
            ls -la target/x86_64-pc-windows-msvc/debug/simpleble-probe.exe || echo "no exe artifact found"
            echo "BUILD_EXIT_CODE=$code"
            echo "BUILD_SECONDS=$((end - start))"
          } >> "$log"
          echo "build_exit=$code" >> "$GITHUB_OUTPUT"
          # 本步永不失败：先把日志提交回分支，成败由最后的 Verdict 步裁定。
          exit 0

      - name: Commit build log back to spike/simpleble-ci
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-log.txt
          if git diff --cached --quiet; then
            echo "build-log.txt 无变化，跳过提交"
            exit 0
          fi
          if [ "${{ steps.build.outputs.build_exit }}" = "0" ]; then result="成功"; else result="失败"; fi
          git commit -m "simpleble-probe 构建日志：${result}（run ${{ github.run_id }}）"
          git push origin HEAD:spike/simpleble-ci

      - name: Verdict
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.build.outputs.build_exit }}" != "0" ]; then
            echo "simplersble Windows 构建失败（详见本分支 build-log.txt）"
            exit 1
          fi
          echo "simplersble Windows 构建成功（详见本分支 build-log.txt）"
