[package]
name = "bluelink-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
bluelink-domain = { path = "../crates/domain" }
bluelink-storage = { path = "../crates/storage" }
bluelink-transport = { path = "../crates/transport" }
bluelink-ai = { path = "../crates/ai" }
bluelink-services = { path = "../crates/services" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
